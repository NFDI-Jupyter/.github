name: Report an error in a Jupyter4NFDI training module
description: Report incorrect, unclear, or outdated content in one of the training modules.
title: "[Module error]: "
labels: ["content"]
body:
  - type: input
    id: module
    attributes:
      label: Module
      description: Which module contains the problem?
      placeholder: "e.g. Mounting S3 storage"
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page or section
      description: Please provide the page URL or section heading, if possible.
      placeholder: "https://..."

  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Describe the error, unclear explanation, or outdated information.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Suggested correction
      description: If you know what the correct information should be, please add it here.

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add screenshots, error messages, references, or other useful context.
